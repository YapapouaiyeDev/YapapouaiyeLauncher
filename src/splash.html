<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Yapapouaiye Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-logo {
      width: 180px;
      height: 180px;
      border-radius: 4px;
      object-fit: cover;
      opacity: 0;
      transform: scale(0.6);
      animation: pop-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center;
      will-change: transform, opacity;
      position: relative;
      z-index: 2;
    }
    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <img id="splash-logo" class="splash-logo" src="../assets/logo.png" alt="Yapapouaiye Logo" draggable="false" />
</body>
</html>
