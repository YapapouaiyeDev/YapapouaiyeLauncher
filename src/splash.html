<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Yapapouaiye Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-logo {
      width: 180px;
      height: 180px;
      border-radius: 24px;
      opacity: 0;
      transform: scale(0.6);
      animation: pop-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center;
      will-change: transform, opacity;
      position: relative;
      z-index: 2;
    }
    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* The logo's SHAPE: a rounded square that grows into the window frame */
    .logo-shape {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 180px;
      height: 180px;
      margin: -90px 0 0 -90px;
      background: #0d1117;
      border-radius: 24px;
      opacity: 0;
      transform: scale(0, 0);
      transform-origin: center;
      will-change: transform, border-radius, opacity;
    }
    .logo-shape.growing {
      opacity: 1;
      border-radius: 0px;
      transition: transform 0.75s cubic-bezier(0.7, 0, 0.3, 1),
                  border-radius 0.75s cubic-bezier(0.7, 0, 0.3, 1),
                  opacity 0.15s linear;
    }
    .splash-logo.fading {
      opacity: 0;
      transition: opacity 0.2s linear;
    }
  </style>
</head>
<body>
  <div id="logo-shape" class="logo-shape"></div>
  <img id="splash-logo" class="splash-logo" src="../assets/logo.png" alt="Yapapouaiye Logo" draggable="false" />
  <script>
    // ~5s after the logo appears, the logo's SHAPE grows to cover the window,
    // then the real window opens over it.
    setTimeout(() => {
      const logo = document.getElementById('splash-logo');
      const shape = document.getElementById('logo-shape');

      // Fade the logo image out, keep only its silhouette
      logo.style.animation = 'none';
      logo.classList.add('fading');

      // Grow the rounded square into the window shape
      const scaleX = window.innerWidth / 180;
      const scaleY = window.innerHeight / 180;
      shape.style.transform = `scale(${scaleX}, ${scaleY})`;
      shape.classList.add('growing');
    }, 5000);
  </script>
</body>
</html>
